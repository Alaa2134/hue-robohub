<script>
function plot(id,col,f,fill){const c=document.getElementById(id),x=c.getContext('2d');const W=c.width,H=c.height;x.strokeStyle='#162640';for(let i=0;i<W;i+=40){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}for(let j=0;j<H;j+=30){x.beginPath();x.moveTo(0,j);x.lineTo(W,j);x.stroke()}
