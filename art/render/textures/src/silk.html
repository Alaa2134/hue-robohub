<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"JetBrains Mono";src:url(../../../../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2)}
html,body{margin:0;background:transparent;overflow:hidden}</style></head><body><canvas id="c"></canvas><script>
const P=new URLSearchParams(location.search);const W=+P.get('w'),H=+P.get('h'),kind=P.get('k');
const c=document.getElementById('c');c.width=W;c.height=H;const x=c.getContext('2d');
let s=+P.get('seed')||5;function r(){s=(s*9301+49297)%233280;return s/233280}
const mm=W/(+P.get('wmm'));
// copper traces under the mask (very faint)
x.strokeStyle='rgba(60,70,80,0.35)';x.lineWidth=0.35*mm;x.lineCap='round';
for(let i=0;i<70;i++){let px=r()*W,py=r()*H;x.beginPath();x.moveTo(px,py);for(let k=0;k<4;k++){if(r()<.5)px+=(r()-.5)*W*.5;else py+=(r()-.5)*H*.5;x.lineTo(px,py)}x.stroke()}
// vias
x.fillStyle='rgba(200,160,70,0.9)';for(let i=0;i<60;i++){x.beginPath();x.arc(r()*W,r()*H,0.35*mm,0,7);x.fill()}
// silkscreen
x.strokeStyle='rgba(235,240,245,0.95)';x.fillStyle='rgba(235,240,245,0.95)';x.lineWidth=0.18*mm;
x.font=`600 ${1.15*mm}px "JetBrains Mono"`;x.textBaseline='middle';
function label(t,px,py,rot=0,size=1.15){x.save();x.translate(px*mm,py*mm);x.rotate(rot);x.font=`600 ${size*mm}px "JetBrains Mono"`;x.fillText(t,0,0);x.restore()}
function box(px,py,w,h){x.strokeRect(px*mm,py*mm,w*mm,h*mm)}
const wmm=+P.get('wmm'),hmm=H/mm;
if(kind==='esp32'){box(5,2.5,18.5,26);label('ESP32-S3-WROOM-1',6,31,0,1);
 const pins=['3V3','EN','4','5','6','7','15','16','17','18','8','3','46','9','10','11','12','13','14'];pins.forEach((p,i)=>{label(p,2.6,6+i*2.54,0,0.9);label(['GND','TX','RX','1','2','42','41','40','39','38','37','36','35','0','45','48','47','21','20'][i],wmm-6.4,6+i*2.54,0,0.9)});
 label('HUE ROBOHUB',4.6,hmm-9,0,1.5);label('DEVKIT · REV 2',5.4,hmm-6.6,0,1);label('BOOT',3.8,hmm-14.5,0,0.9);label('RST',wmm-7.6,hmm-14.5,0,0.9)}
if(kind==='stm32'){box(28,16,16,16);label('STM32G431',29,34,0,1.3);label('RH-NUCLEO · 64',4,4,0,1.8);label('HUE ROBOHUB',4,hmm-4,0,1.6);
 for(let i=0;i<16;i++){label(String(i),18+i*2.54,hmm-7,0,0.8)};label('USB',2.5,22,0,1);label('PWR',wmm-12,22,0,1);label('CN7',18,8,0,1)}
if(kind==='uno'){label('ROBOHUB UNO',22,hmm/2+2,0,2.4);label('DIGITAL (PWM ~)',22,6,0,1.2);label('ANALOG IN',36,hmm-6,0,1.2);label('POWER',16,hmm-6,0,1.2);label('ON',52,24,0,1);label('TX',52,28,0,0.9);label('RX',52,31,0,0.9);box(30,19,9,9);label('BUILD · LEARN · COMPETE',22,hmm/2+6,0,1)}
if(kind==='driver'){label('RH MDRV-02',4,4,0,1.8);label('+12V  GND',4,hmm-12,0,1.1);label('OUTA  OUTB  ',wmm-18,hmm-12,0,1.1);label('PWM DIR EN 5V GND',8,hmm-3,0,0.9);box(9,8,26,24)}
// pads (gold) in header rows
if(kind==='esp32'){x.fillStyle='rgba(220,175,80,1)';for(let i=0;i<19;i++){x.fillRect(0.6*mm,(4.9+i*2.54)*mm,1.4*mm,1.4*mm);x.fillRect((wmm-2)*mm,(4.9+i*2.54)*mm,1.4*mm,1.4*mm)}}
</script></body></html>
