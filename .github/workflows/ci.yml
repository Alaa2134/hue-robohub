# Checks every pull request the same way the deploy does, without publishing.
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run lint
      - name: Build
        run: node scripts/build-static.mjs
        env:
          CNAME: buildxhue.com
          SITE_URL: https://buildxhue.com
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      - name: Smoke tests
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
