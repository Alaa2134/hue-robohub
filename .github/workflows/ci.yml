# Checks every pull request the same way the deploy does, without publishing.
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund --prefix studio
      - run: npx tsc --noEmit
      - run: npm run lint
      # Every Arabic text in the app has its English (src/portal/i18n/en.json).
      - run: node scripts/i18n-extract.mjs --check
      # BuildX Lab: the compiler pack, then the compiler, circuit solver and simulator unit tests
      # (every example project is built with GCC and run on the simulated ATmega328P).
      - run: node scripts/lab-toolchain.mjs
      - run: npx vitest run --project unit
      # Chromium first: the build draws the share images with it, then the smoke tests use it.
      - run: npx playwright install --with-deps chromium
      - name: Build
        run: node scripts/build-static.mjs
        env:
          CNAME: buildxhue.com
          SITE_URL: https://buildxhue.com
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      - name: Smoke tests
        run: npx playwright test
      - name: Lighthouse (mobile)
        # Reports the phone scores and Core Web Vitals in the run summary; never fails the build.
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        run: node scripts/lighthouse-mobile.mjs out-static

  # BuildX AI Studio Pro: typecheck, unit tests, then the whole server flow against real Postgres,
  # Redis and FFmpeg (upload → probe → timeline → MP4 render → download → ffprobe).
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npx vitest run
        env:
          STUDIO_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          STUDIO_TEST_REDIS_URL: redis://localhost:6379
      - run: npx vite build
        working-directory: studio/apps/web
