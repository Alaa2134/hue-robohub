name: Dependency security audit
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Audit production dependencies (root)
        run: npm audit --omit=dev --audit-level=high
      - name: Audit production dependencies (studio)
        if: always()
        run: npm audit --prefix studio --omit=dev --audit-level=high
