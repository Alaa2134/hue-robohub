# Builds the static site and publishes it to gh-pages (served at https://buildxhue.com).
# Also runs every 30 minutes: when the team has published or changed something in the BuildX App,
# the site is rebuilt so the new members, posts, projects and events get their own pages.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'schedule'
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          now=$(node scripts/content-version.mjs)
          live=$(curl -fsS "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/content-version.txt" || echo none)
          echo "published content: $now · live site: $live"
          if [ "$now" != "unknown" ] && [ "$now" != "$live" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; else echo "build=false" >> "$GITHUB_OUTPUT"; fi

  deploy:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run lint
      - name: Build
        run: node scripts/build-static.mjs
        env:
          CNAME: buildxhue.com
          SITE_URL: https://buildxhue.com
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      - name: Smoke tests
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out-static
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: "Deploy ${{ github.sha }}"
