# Builds the static site and publishes it to gh-pages (served at https://buildxhue.com).
# Also runs every 30 minutes: when the team has published or changed something in the BuildX App,
# the site is rebuilt so the new members, posts, projects and events get their own pages.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

# Read-only by default: only the publish step (which runs no project code) can write to gh-pages.
permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: github.event_name == 'schedule'
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          now=$(node scripts/content-version.mjs)
          live=$(curl -fsS "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/content-version.txt" || echo none)
          echo "published content: $now · live site: $live"
          if [ "$now" != "unknown" ] && [ "$now" != "$live" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; else echo "build=false" >> "$GITHUB_OUTPUT"; fi

  deploy:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run lint
      # Chromium first: the build draws the share images with it, then the smoke tests use it.
      - run: npx playwright install --with-deps chromium
      - name: Build
        run: node scripts/build-static.mjs
        env:
          CNAME: buildxhue.com
          SITE_URL: https://buildxhue.com
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      # Baqloz's recorded voice (made by the "Baqloz voice" workflow) goes in /voice/.
      - name: Voice clips
        run: |
          if git ls-remote --exit-code --heads origin voice-assets >/dev/null; then
            git fetch -q --depth=1 origin voice-assets
            git archive FETCH_HEAD | tar -x -C out-static/voice
            echo "$(ls out-static/voice | wc -l) voice files"
          fi
      - name: Smoke tests
        run: npx playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site
          path: out-static
          include-hidden-files: true
          retention-days: 1

  publish:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: out-static
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out-static
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: "Deploy ${{ github.sha }}"
