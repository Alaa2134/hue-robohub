# Builds the static site and publishes it to gh-pages (served at https://buildxhue.com).
# Also runs every 30 minutes: when the team has published or changed something in the BuildX App,
# the site is rebuilt so the new members, posts, projects and events get their own pages.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

# Read-only by default: only the publish step (which runs no project code) can write to gh-pages.
permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: github.event_name == 'schedule'
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          now=$(node scripts/content-version.mjs)
          live=$(curl -fsS "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/content-version.txt" || echo none)
          echo "published content: $now · live site: $live"
          if [ "$now" != "unknown" ] && [ "$now" != "$live" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; else echo "build=false" >> "$GITHUB_OUTPUT"; fi

  deploy:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund --prefix studio
      - run: npx tsc --noEmit
      - run: npm run lint
      # Chromium first: the build draws the share images with it, then the smoke tests use it.
      - run: npx playwright install --with-deps chromium
      # Screenshots for "مواقع هتفيدك" (made by the "Directory screenshots" workflow), before the build.
      - name: Directory screenshots
        run: |
          if git ls-remote --exit-code --heads origin directory-assets >/dev/null; then
            git fetch -q --depth=1 origin directory-assets
            mkdir -p public/media/directory
            git archive FETCH_HEAD | tar -x -C public/media/directory
            echo "$(ls public/media/directory | wc -l) screenshots"
          fi
      - name: Build
        run: node scripts/build-static.mjs
        env:
          CNAME: buildxhue.com
          SITE_URL: https://buildxhue.com
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          # The studio's render server (studio/README.md); empty until it's deployed.
          STUDIO_API_URL: ${{ vars.STUDIO_API_URL }}
      # Baqloz's recorded voice (made by the "Baqloz voice" workflow) goes in /voice/.
      - name: Voice clips
        run: |
          if git ls-remote --exit-code --heads origin voice-assets >/dev/null; then
            git fetch -q --depth=1 origin voice-assets
            git archive FETCH_HEAD | tar -x -C out-static/voice
            echo "$(ls out-static/voice | wc -l) voice files"
          fi
      - name: Smoke tests
        run: npx playwright test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: out-static
          include-hidden-files: true
          retention-days: 1

  publish:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # Only when the site is behind Cloudflare (docs/cloudflare.md): its cache is cleared after a deploy.
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ZONE: ${{ vars.CLOUDFLARE_ZONE_ID }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: out-static
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out-static
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: "Deploy ${{ github.sha }}"
      - name: Clear the Cloudflare cache
        if: env.CF_TOKEN != ''
        run: |
          sleep 60 # GitHub Pages takes about a minute to serve the new files
          # The zone is found by the domain when CLOUDFLARE_ZONE_ID isn't set.
          [ -n "$CF_ZONE" ] || CF_ZONE=$(curl -fsS "https://api.cloudflare.com/client/v4/zones?name=buildxhue.com" -H "Authorization: Bearer $CF_TOKEN" | jq -r '.result[0].id // empty')
          [ -n "$CF_ZONE" ] || { echo "No Cloudflare zone for buildxhue.com yet"; exit 0; }
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | grep -q '"success":true'

  # A second copy on Cloudflare Pages (docs/cloudflare.md, "Cloudflare Pages"), only once its token
  # is set. The live domain stays on GitHub Pages until it is switched by hand.
  pages:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Token set?
        id: on
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "No CLOUDFLARE_PAGES_TOKEN: skipping the Cloudflare Pages copy"; echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.on.outputs.go == 'true'
        with:
          sparse-checkout: cloudflare
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.on.outputs.go == 'true'
        with:
          name: site
          path: out-static
      - name: Deploy to Cloudflare Pages
        if: steps.on.outputs.go == 'true'
        run: |
          cp cloudflare/_headers out-static/_headers
          rm -f out-static/CNAME out-static/.nojekyll
          # The account is found from the token when CLOUDFLARE_ACCOUNT_ID isn't set.
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            CLOUDFLARE_ACCOUNT_ID=$(curl -fsS https://api.cloudflare.com/client/v4/accounts -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result[0].id // empty')
            [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::The token can't see any Cloudflare account (it needs Account → Cloudflare Pages → Edit)"; exit 1; }
            export CLOUDFLARE_ACCOUNT_ID
          fi
          npx -y wrangler@4.149.0 pages project create buildx-hue --production-branch=main 2>/dev/null || true
          npx -y wrangler@4.149.0 pages deploy out-static --project-name=buildx-hue --branch=main --commit-dirty=true
          echo "Live copy: https://buildx-hue.pages.dev"
