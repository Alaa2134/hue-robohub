# Builds the store app from the BuildX App (see mobile/README.md):
#   BuildX HUE (com.buildxhue.student) — students and the training team, one sign-in
#
# Run it from Actions → "Mobile apps" → Run workflow. Each run gives:
#   Android: a signed .aab (download it from the run and upload it to Google Play Console)
#   iOS:     an upload to TestFlight (then "Add for review" in App Store Connect)
# Without the signing secrets it still checks that the project builds (unsigned Android, iOS simulator),
# which is also what runs on pull requests that touch the apps.
name: Mobile apps

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version shown in the stores (e.g. 1.0.0)
        default: "1.0.0"
        required: true
  pull_request:
    paths: ["mobile/**", "scripts/build-native.mjs", ".github/workflows/mobile.yml"]

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Explicit bash adds pipefail, so a failing xcodebuild piped into tail still fails the step.
    shell: bash

env:
  VERSION_NAME: ${{ inputs.version || '1.0.0' }}
  # Store build numbers must only go up: each build uses 100 + this run number.
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build the site and the app bundles
        run: |
          node scripts/build-static.mjs
          node scripts/build-native.mjs
        env:
          CNAME: buildxhue.com
          SITE_URL: https://buildxhue.com
      - uses: actions/upload-artifact@v4
        with:
          name: www
          path: mobile/app/www
          retention-days: 3

  android:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: www
          path: mobile/app/www
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Copy the app into the Android project
        working-directory: mobile
        run: |
          npm ci --no-audit --no-fund
          cd app && npx cap sync android
      - name: Firebase (push notifications)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > mobile/app/android/app/google-services.json
            # Tells the app push is set up in this build (see src/portal/native-push.ts).
            echo '{"android":true}' > mobile/app/android/app/src/main/assets/public/app/push.json
          else
            echo "::notice::GOOGLE_SERVICES_JSON is not set: the Android app builds without push notifications."
          fi
      # Only manual release runs get the signing key: pull-request builds run branch code, so they
      # build unsigned (enough to check the app compiles).
      - name: Signing key
        id: key
        env:
          KEYSTORE: ${{ github.event_name == 'workflow_dispatch' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "file=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: building an unsigned bundle (fine for checks, not for Play)."
          fi
      - name: Build the bundle
        working-directory: mobile/app/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.key.outputs.file }}
          ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ github.event_name == 'workflow_dispatch' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          export VERSION_CODE=$((100 + BUILD_NUMBER))
          chmod +x gradlew
          mkdir -p "$RUNNER_TEMP/out"
          if [ -n "$ANDROID_KEYSTORE_FILE" ]; then
            ./gradlew --no-daemon bundleRelease assembleRelease
            cp app/build/outputs/bundle/release/*.aab "$RUNNER_TEMP/out/buildx-hue-${VERSION_NAME}-${VERSION_CODE}.aab"
            cp app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/out/buildx-hue-${VERSION_NAME}-${VERSION_CODE}.apk"
          else
            # No key yet: a debug APK still installs on any Android phone for trying the app.
            ./gradlew --no-daemon bundleRelease assembleDebug
            cp app/build/outputs/apk/debug/*.apk "$RUNNER_TEMP/out/buildx-hue-${VERSION_NAME}-${VERSION_CODE}-test.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ${{ runner.temp }}/out
          retention-days: 30

  ios:
    needs: web
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: www
          path: mobile/app/www
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Copy the app into the Xcode project
        working-directory: mobile
        run: |
          npm ci --no-audit --no-fund
          cd app && npx cap sync ios
      - name: Check the project builds (no signing)
        if: github.event_name == 'pull_request'
        working-directory: mobile/app/ios/App
        run: xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -n 40
      - name: Archive and upload to TestFlight
        if: github.event_name == 'workflow_dispatch'
        working-directory: mobile/app/ios/App
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$TEAM_ID" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::warning::Apple secrets are not set (APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8): checking the build only."
            xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -n 40
            exit 0
          fi
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          # Capabilities are opt-in (repository variables), so a missing Apple setup never breaks the upload:
          #   IOS_PUSH=1             push notifications (APNs key added in Supabase, see mobile/README.md)
          #   IOS_UNIVERSAL_LINKS=1  buildxhue.com/app links open the app (needs https on the site)
          ENT=""
          if [ "${{ vars.IOS_PUSH }}" = "1" ]; then
            ENT="$ENT<key>aps-environment</key><string>production</string>"
            # Tells the app push is set up in this build (see src/portal/native-push.ts).
            echo '{"ios":true}' > App/public/app/push.json
          fi
          if [ "${{ vars.IOS_UNIVERSAL_LINKS }}" = "1" ]; then
            ENT="$ENT<key>com.apple.developer.associated-domains</key><array><string>applinks:buildxhue.com</string></array>"
          fi
          EXTRA=()
          if [ -n "$ENT" ]; then
            printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0"><dict>%s</dict></plist>\n' "$ENT" > App/App.entitlements
            EXTRA=(CODE_SIGN_ENTITLEMENTS=App/App.entitlements)
          fi
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" "${AUTH[@]}" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION_NAME" CURRENT_PROJECT_VERSION="$((100 + BUILD_NUMBER))" "${EXTRA[@]}" \
            archive | tail -n 60
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}" | tail -n 40
          rm -f "$KEY"
          echo "Uploaded BuildX HUE $VERSION_NAME ($((100 + BUILD_NUMBER))) to App Store Connect. It shows up in TestFlight after Apple processes it (5–30 min)."
